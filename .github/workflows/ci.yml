name: Deskforge CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:db
      - run: npm run verify:tasks
      - run: npm run verify:migrations
      - run: npm run verify:workbench
      - run: npm run verify:data
      - run: npm run verify:reminders
      - run: npm run build
